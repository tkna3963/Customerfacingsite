<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ご注文状況</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin: 10px 0 24px;
        }

        .panel {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background: #eeeeee;
            white-space: pre-wrap;
        }

        .number-label {
            text-align: center;
            color: #666;
            font-size: 15px;
        }

        .order-number {
            text-align: center;
            font-size: 76px;
            line-height: 1;
            font-weight: 800;
            margin: 10px 0 24px;
        }

        .status-box {
            text-align: center;
            border-radius: 12px;
            padding: 20px;
            background: #f3f4f6;
            margin-bottom: 22px;
        }

        .status-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }

        .status-text {
            font-size: 30px;
            font-weight: 800;
        }

        .info {
            border-top: 1px solid #eee;
            padding: 14px 0;
        }

        .info:first-child {
            border-top: none;
        }

        .info-label {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .info-value {
            font-weight: 600;
            word-break: break-all;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
        }

        .item-detail {
            color: #666;
            font-size: 14px;
            margin-top: 3px;
        }

        .item-price {
            white-space: nowrap;
            font-weight: 600;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
        }

        .loading {
            color: #555;
        }

        .updated {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 18px;
        }

        /* ==================================================
           進行バー（ページを開いたときに進行するアニメーション）
        ================================================== */

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 26px;
        }

        .progress-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 4px;
            width: 0%;
            transition: width 1.2s ease-out;
        }

        /* ==================================================
           ステップインジケーター
        ================================================== */

        .step-track {
            display: flex;
            align-items: flex-start;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 auto;
        }

        .step-circle {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.3;
            color: white;
            background: #cbd5e1;
            flex-shrink: 0;
        }

        .step.done .step-circle {
            background: #2563eb;
        }

        .step.current .step-circle {
            background: #2563eb;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.45;
            }
        }

        .step-arrow {
            flex: 0 0 auto;
            width: 28px;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 20px;
        }

        .step-arrow.done {
            color: #2563eb;
        }

        /* ==================================================
           受け取り予定時刻
        ================================================== */

        .pickup-time-value {
            font-size: 22px;
            color: #2563eb;
        }

        .pickup-button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .pickup-button {
            flex: 1;
            min-width: 90px;
            padding: 12px 10px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .pickup-button:hover {
            background: #1d4ed8;
        }

        .pickup-button:active {
            transform: scale(0.97);
        }

        .pickup-reset-button {
            flex: 1;
            min-width: 90px;
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            color: #555;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .pickup-reset-button:hover {
            background: #f3f4f6;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .panel {
                padding: 18px;
            }

            .order-number {
                font-size: 60px;
            }

            .status-text {
                font-size: 25px;
            }

            .step-circle {
                width: 58px;
                height: 58px;
                font-size: 11px;
            }

            .step-arrow {
                width: 20px;
                height: 58px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ご注文状況</h1>

    <div class="panel">

        <div id="message" class="message loading">
            ご注文情報を読み込んでいます...
        </div>

        <div id="orderContent" style="display:none;">

            <div class="number-label">
                ご注文番号
            </div>

            <div id="orderNumber" class="order-number">
                -
            </div>

            <div class="status-box">
                <div class="status-title">
                    現在の状態
                </div>

                <div id="statusText" class="status-text">
                    -
                </div>
            </div>

            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <div id="stepTrack" class="step-track">
            </div>

            <div class="info">
                <div class="info-label">
                    注文日時
                </div>

                <div id="createdAt" class="info-value">
                    -
                </div>
            </div>

            <div class="info">
                <div class="info-label">
                    受け取り予定時刻
                </div>

                <div id="pickupTime" class="info-value pickup-time-value">
                    未設定
                </div>

                <div class="pickup-button-row">

                    <button
                        type="button"
                        class="pickup-button"
                        id="pickup10Button"
                    >
                        +10分
                    </button>

                    <button
                        type="button"
                        class="pickup-button"
                        id="pickup15Button"
                    >
                        +15分
                    </button>

                    <button
                        type="button"
                        class="pickup-reset-button"
                        id="pickupResetButton"
                    >
                        リセット
                    </button>

                </div>

            </div>

        </div>

    </div>


    <div id="itemsPanel" class="panel" style="display:none;">

        <h2>ご注文内容</h2>

        <div id="items">
        </div>

        <div class="info">
            <div class="info-label">
                割引
            </div>

            <div id="discount" class="info-value">
                ¥0
            </div>
        </div>

    </div>


    <div id="debugPanel" class="panel" style="display:none;">

        <div class="info">
            <div class="info-label">
                Document ID
            </div>

            <div id="documentId" class="info-value">
                -
            </div>
        </div>

        <div class="info">
            <div class="info-label">
                Order ID
            </div>

            <div id="debugOrderId" class="info-value">
                -
            </div>
        </div>

        <div class="updated" id="updatedAt">
            -
        </div>

    </div>

</div>


<script type="module">

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getFirestore,
        doc,
        onSnapshot,
        updateDoc
    }
    from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // ==================================================
    // Firebase
    // ==================================================

    let db = null;


    // ==================================================
    // このページで参照するドキュメント参照
    // 受け取り時刻の更新などで使う
    // ==================================================

    let currentDocumentRef = null;


    // ==================================================
    // URLパラメータ
    //
    // 店側HTMLが作るURL:
    //
    // customer.html?doc=abc123XXXX
    //
    // ==================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    // ==================================================
    // 1ドキュメント = 1注文のため
    // doc パラメータのみで特定できる
    // ==================================================

    const documentId =
        params.get("doc");


    // ==================================================
    // ステータス
    //
    // 1 = 注文済み (ordered)
    // 2 = 調理中 (cooking)
    // 3 = 未配達 (undelivered) ※現在未使用
    // 4 = 配達中 (shipped)
    // 5 = 受け取り済み (received)
    // 6 = 呼び出し済み (called)
    // 7 = 提供済み (served)
    // ==================================================

    const STATUS_TEXT = {

        1: "注文済み",

        2: "調理中",

        4: "配達中",

        5: "受け取り済み",

        6: "呼び出し済み",

        7: "提供済み"

    };


    // ステップインジケーターに表示する順序（3を除く）
    const STATUS_STEPS = [
        { key: 1, label: "注文済み" },
        { key: 2, label: "調理中" },
        { key: 4, label: "配達中" },
        { key: 5, label: "受け取り済み" },
        { key: 6, label: "呼び出し済み" },
        { key: 7, label: "提供済み" }
    ];


    // ==================================================
    // 表示
    // ==================================================

    function showError(text) {

        const message =
            document.getElementById(
                "message"
            );

        message.className =
            "message error";

        message.textContent =
            text;

    }


    // ==================================================
    // ステップインジケーター描画
    // ==================================================

    function renderSteps(status) {

        const track =
            document.getElementById(
                "stepTrack"
            );

        track.innerHTML =
            "";

        const currentIndex =
            STATUS_STEPS.findIndex(
                (step) => step.key === status
            );

        STATUS_STEPS.forEach(
            (step, index) => {

                const stepEl =
                    document.createElement(
                        "div"
                    );

                stepEl.className =
                    "step";

                if (index < currentIndex) {
                    stepEl.classList.add("done");
                } else if (index === currentIndex) {
                    stepEl.classList.add("current");
                }

                const circle =
                    document.createElement(
                        "div"
                    );

                circle.className =
                    "step-circle";

                circle.textContent =
                    step.label;

                stepEl.appendChild(
                    circle
                );

                track.appendChild(
                    stepEl
                );

                if (index < STATUS_STEPS.length - 1) {

                    const arrow =
                        document.createElement(
                            "div"
                        );

                    arrow.className =
                        "step-arrow" +
                        (index < currentIndex ? " done" : "");

                    arrow.textContent =
                        "→";

                    track.appendChild(
                        arrow
                    );

                }

            }
        );

    }


    // ==================================================
    // 進行バー：ページを開いたとき／更新のたびに伸びる
    // ==================================================

    function getProgressPercent(status) {

        const index =
            STATUS_STEPS.findIndex(
                (step) => step.key === status
            );

        if (index === -1) {
            return 0;
        }

        return (
            (index + 1) /
            STATUS_STEPS.length *
            100
        );

    }

    function updateProgressBar(status) {

        const fill =
            document.getElementById(
                "progressFill"
            );

        // 一度0%にリセットしてから伸びるアニメーションを再生
        fill.style.transition =
            "none";

        fill.style.width =
            "0%";

        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    () => {

                        fill.style.transition =
                            "width 1.2s ease-out";

                        fill.style.width =
                            getProgressPercent(status) + "%";

                    }
                );

            }
        );

    }


    // ==================================================
    // 受け取り予定時刻
    //
    // Firestoreには ISO文字列 (Date#toISOString) で保存する
    // ==================================================

    function formatPickupTime(isoString) {

        const date =
            new Date(
                isoString
            );

        if (isNaN(date.getTime())) {
            return null;
        }

        const hh =
            String(
                date.getHours()
            ).padStart(2, "0");

        const mm =
            String(
                date.getMinutes()
            ).padStart(2, "0");

        return (
            hh +
            ":" +
            mm
        );

    }


    function renderPickupTime(pickupTimeIso) {

        const el =
            document.getElementById(
                "pickupTime"
            );

        const formatted =
            pickupTimeIso
                ? formatPickupTime(pickupTimeIso)
                : null;

        el.textContent =
            formatted ??
            "未設定";

        el.dataset.iso =
            pickupTimeIso ??
            "";

    }


    // ==================================================
    // 受け取り予定時刻の更新
    //
    // 現在の予定時刻（未設定なら現在時刻）を基準に
    // 指定した分数だけ進める
    // ==================================================

    async function adjustPickupTime(minutes) {

        if (!currentDocumentRef) {
            return;
        }

        try {

            const baseTimeText =
                document.getElementById(
                    "pickupTime"
                ).dataset.iso;

            const baseDate =
                (baseTimeText && baseTimeText !== "")
                    ? new Date(baseTimeText)
                    : new Date();

            const newDate =
                new Date(
                    baseDate.getTime() +
                    minutes * 60 * 1000
                );

            await updateDoc(
                currentDocumentRef,
                {
                    pickupTime:
                        newDate.toISOString()
                }
            );

        }
        catch (error) {

            console.error(
                error
            );

            alert(
                "受け取り予定時刻の更新に失敗しました\n\n" +
                error.message
            );

        }

    }


    async function resetPickupTime() {

        if (!currentDocumentRef) {
            return;
        }

        try {

            await updateDoc(
                currentDocumentRef,
                {
                    pickupTime:
                        new Date().toISOString()
                }
            );

        }
        catch (error) {

            console.error(
                error
            );

            alert(
                "受け取り予定時刻のリセットに失敗しました\n\n" +
                error.message
            );

        }

    }


    document.getElementById(
        "pickup10Button"
    ).addEventListener(
        "click",
        () => {

            adjustPickupTime(
                10
            );

        }
    );


    document.getElementById(
        "pickup15Button"
    ).addEventListener(
        "click",
        () => {

            adjustPickupTime(
                15
            );

        }
    );


    document.getElementById(
        "pickupResetButton"
    ).addEventListener(
        "click",
        () => {

            resetPickupTime();

        }
    );


    function showOrder(order) {

        document.getElementById(
            "message"
        ).style.display =
            "none";


        document.getElementById(
            "orderContent"
        ).style.display =
            "block";


        document.getElementById(
            "itemsPanel"
        ).style.display =
            "block";


        document.getElementById(
            "debugPanel"
        ).style.display =
            "block";


        // 注文番号
        document.getElementById(
            "orderNumber"
        ).textContent =
            order.orderId ?? documentId;


        // ステータス
        const status =
            Number(order.status ?? 1);


        document.getElementById(
            "statusText"
        ).textContent =
            STATUS_TEXT[status] ??
            "状態不明";


        // ステップインジケーター・進行バー
        renderSteps(
            status
        );

        updateProgressBar(
            status
        );


        // 作成日時
        document.getElementById(
            "createdAt"
        ).textContent =
            order.creatAt ?? "-";


        // 受け取り予定時刻
        renderPickupTime(
            order.pickupTime
        );


        // 割引
        const discount =
            Number(order.discount ?? 0);


        document.getElementById(
            "discount"
        ).textContent =
            "¥" +
            discount.toLocaleString(
                "ja-JP"
            );


        // 商品
        const itemsElement =
            document.getElementById(
                "items"
            );


        itemsElement.innerHTML =
            "";


        const items =
            Array.isArray(order.item)
                ? order.item
                : [];


        if (items.length === 0) {

            itemsElement.innerHTML =
                '<div class="info-value">商品情報はありません</div>';

        } else {

            items.forEach(
                (item) => {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "item";


                    const left =
                        document.createElement(
                            "div"
                        );


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "item-name";

                    name.textContent =
                        item.productName ??
                        "商品";


                    const detail =
                        document.createElement(
                            "div"
                        );

                    detail.className =
                        "item-detail";

                    detail.textContent =
                        "数量: " +
                        (item.quantity ?? 0);


                    left.appendChild(
                        name
                    );

                    left.appendChild(
                        detail
                    );


                    const price =
                        document.createElement(
                            "div"
                        );

                    price.className =
                        "item-price";


                    const unitPrice =
                        Number(
                            item.unitPrice ?? 0
                        );


                    price.textContent =
                        "¥" +
                        (
                            unitPrice *
                            Number(item.quantity ?? 0)
                        ).toLocaleString(
                            "ja-JP"
                        );


                    row.appendChild(
                        left
                    );

                    row.appendChild(
                        price
                    );


                    itemsElement.appendChild(
                        row
                    );

                }
            );

        }


        // デバッグ情報
        document.getElementById(
            "documentId"
        ).textContent =
            documentId;


        document.getElementById(
            "debugOrderId"
        ).textContent =
            order.orderId ?? documentId;


        document.getElementById(
            "updatedAt"
        ).textContent =
            "最新情報を表示中";

    }


    // ==================================================
    // Firebase開始
    // ==================================================

    async function startFirebase() {

        try {

            if (!documentId) {

                showError(
                    "注文URLが正しくありません。\n\n" +
                    "doc がありません。"
                );

                return;
            }


            // Firebase設定
            const response =
                await fetch(
                    "./firebasejson/firebase_config.json"
                );


            if (!response.ok) {

                throw new Error(
                    "firebase_config.jsonを読み込めませんでした"
                );

            }


            const firebaseConfig =
                await response.json();


            // Firebase初期化
            const app =
                initializeApp(
                    firebaseConfig
                );


            db =
                getFirestore(
                    app
                );


            // ==================================================
            // test/{documentId}
            //
            // 1ドキュメント = 1注文
            // ==================================================

            const documentRef =
                doc(
                    db,
                    "test",
                    documentId
                );

            currentDocumentRef =
                documentRef;


            // ==================================================
            // リアルタイム監視
            //
            // 店側でstatusを変更すると
            // お客様画面も自動更新
            // ==================================================

            onSnapshot(
                documentRef,

                (snapshot) => {

                    if (!snapshot.exists()) {

                        showError(
                            "注文情報が見つかりません。"
                        );

                        return;
                    }


                    const order =
                        snapshot.data();


                    showOrder(
                        order
                    );

                },

                (error) => {

                    console.error(
                        error
                    );


                    showError(
                        "注文情報を取得できませんでした。\n\n" +
                        error.message
                    );

                }
            );

        }
        catch (error) {

            console.error(
                error
            );


            showError(
                "Firebase接続エラー\n\n" +
                error.message
            );

        }

    }


    // ==================================================
    // 開始
    // ==================================================

    startFirebase();

</script>

</body>
</html>
